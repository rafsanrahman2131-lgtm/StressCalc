# ===================================================
# StressCalculator Spring Boot Configuration (Alwaysdata Cloud MySQL)
# ===================================================

# Server Address and Dynamic Port (Binds cleanly to Alwaysdata $IP and $PORT)
server.address=${IP:0.0.0.0}
server.port=${PORT:8080}

# Alwaysdata Cloud MySQL Database Settings
spring.datasource.url=${MYSQL_URL:jdbc:mysql://mysql-stresscalcu.alwaysdata.net:3306/stresscalcu_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:stresscalcu}
spring.datasource.password=${MYSQL_PASSWORD:xGSGvXRM8Tczc*8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fast Startup JPA Settings (Prevents Alwaysdata 30-Second Upstream Proxy Timeout)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/,file:./
