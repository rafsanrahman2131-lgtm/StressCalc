# ===================================================
# StressCalculator Spring Boot Cloud MySQL Configuration
# ===================================================

# Server Port
server.port=8080

# Cloud MySQL Database Settings (Pre-wired for Aiven / Railway / Cloud MySQL)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/stress_calculator?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/,file:./
