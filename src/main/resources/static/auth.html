<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StressCalculator — Authentication</title>
    <link rel="stylesheet" href="css/styles.css?v=2.0">
    <style>
        /* Multi-step Slider Architecture (Inlined to bypass browser cache) */
        .form-slider-container {
            width: 100% !important;
            overflow: hidden !important; 
            position: relative !important;
        }

        .form-slider-track {
            display: flex !important;
            flex-wrap: nowrap !important;
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            gap: 0 !important;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        .form-step {
            flex: 0 0 100% !important;
            width: 100% !important;
            min-width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
            padding: 0 2px !important;
            margin: 0 !important;
        }

        fieldset.baseline-section,
        .baseline-section {
            width: 100% !important;
            box-sizing: border-box !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
        }

        .auth-visual {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        .auth-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 1;
        }

        .auth-slide.active {
            opacity: 1;
            z-index: 2;
        }

        .auth-quote-overlay {
            position: absolute;
            bottom: 40px;
            left: 40px;
            right: 40px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 16px;
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Visual Left -->
        <div class="auth-visual" id="dynamic-carousel">
            <!-- Images injected by JS -->
            <div class="auth-quote-overlay">
                <p class="auth-quote" id="dynamic-quote" style="transition: opacity 0.5s ease-in-out; opacity: 1;">"Your focus determines your reality. Protect your cognitive bandwidth."</p>
                <span class="auth-quote-author" id="dynamic-author" style="transition: opacity 0.5s ease-in-out; opacity: 1;">— QUANTIFIED SELF</span>
            </div>
        </div>

        <!-- Form Right -->
        <div class="auth-form-wrapper">
            <div class="auth-header-nav">
                <a href="index.html" class="back-link">&larr; Return to Home</a>
                <div class="theme-controls">
                    <button class="theme-btn" onclick="setTheme('light')" id="btn-light-a" data-set-theme="light" aria-label="Light Theme" title="Light Mode">
                        <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/></svg>
                    </button>
                    <button class="theme-btn active" onclick="setTheme('dark')" id="btn-dark-a" data-set-theme="dark" aria-label="Dark Theme" title="Dark Mode">
                        <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/></svg>
                    </button>
                    <button class="theme-btn" onclick="setTheme('contrast')" id="btn-contrast-a" data-set-theme="contrast" aria-label="Focus Theme" title="Contrast Mode">
                        <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    </button>
                </div>
            </div>

            <div class="auth-card">
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
                    <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
                </div>

                <div class="auth-form-content">
                    <h2 id="form-title" style="font-size: 1.8rem; font-weight: 800; margin-bottom: 6px;">Welcome back</h2>
                    <p class="auth-subtext" id="form-subtitle" style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 20px;">Enter your credentials to access your telemetry dashboard.</p>

                    <!-- LOGIN FORM -->
                    <form id="form-login" action="/login" method="POST" style="display: block;">
                        <div class="form-group">
                            <label for="loginEmail">Email Address</label>
                            <input type="email" id="loginEmail" name="loginEmail" placeholder="you@domain.com" required>
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <input type="password" id="loginPassword" name="loginPassword" placeholder="••••••••" required>
                        </div>
                        <div style="text-align: right; margin-bottom: 15px;">
                            <a href="#" class="forgot-pass" style="font-size: 0.85rem; opacity: 0.7; text-decoration: none;">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">Enter Dashboard</button>
                    </form>

                    <!-- SIGNUP MULTI-STEP SLIDER FORM -->
                    <form id="form-signup" action="/register" method="POST" style="display: none;">
                        <div class="form-slider-container">
                            <div class="form-slider-track" id="formTrack">
                                
                                <!-- STEP 1: Identity -->
                                <div class="form-step" id="step1">
                                    <fieldset class="baseline-section">
                                        <legend>Step 1: Identity</legend>
                                        <div class="form-grid">
                                            <div class="form-group span-full">
                                                <label>Full Name</label>
                                                <input type="text" name="fullName" id="regName" placeholder="Your Name" required>
                                            </div>
                                            <div class="form-group span-full">
                                                <label>Email Address</label>
                                                <input type="email" name="email" id="regEmail" placeholder="you@domain.com" required>
                                            </div>
                                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                                                <div class="form-group">
                                                    <label>Date of Birth</label>
                                                    <input type="date" name="regDOB" id="regDOB" required style="font-family: inherit;">
                                                </div>
                                                <div class="form-group">
                                                    <label>Organization / Institution</label>
                                                    <input type="text" name="organization" placeholder="e.g., CUET">
                                                </div>
                                            </div>
                                        </div>
                                    </fieldset>
                                    <div class="step-navigation" style="justify-content: flex-end;">
                                        <button type="button" class="btn btn-primary" onclick="nextStep(1)">Next →</button>
                                    </div>
                                </div>

                                <!-- STEP 2: Physiological -->
                                <div class="form-step" id="step2">
                                    <fieldset class="baseline-section">
                                        <legend>Step 2: Physiological Baseline</legend>
                                        <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                                            <div class="form-group">
                                                <label>Physical Activity</label>
                                                <select name="activityLevel" style="padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color, rgba(15,23,42,0.15)); background: var(--surface, #FFFFFF); color: var(--text-primary, #0F172A); font-size: 0.88rem; outline: none; font-family: inherit; width: 100%;">
                                                    <option value="sedentary">Sedentary</option>
                                                    <option value="moderate">Moderate</option>
                                                    <option value="active" selected>Active / Lean Training</option>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label>Avg. Sleep</label>
                                                <select name="sleepDuration" style="padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color, rgba(15,23,42,0.15)); background: var(--surface, #FFFFFF); color: var(--text-primary, #0F172A); font-size: 0.88rem; outline: none; font-family: inherit; width: 100%;">
                                                    <option value="<6">&lt; 6 hours</option>
                                                    <option value="6-8">6-8 hours</option>
                                                    <option value=">8">8+ hours</option>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label>Caffeine Intake</label>
                                                <select name="caffeine" style="padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color, rgba(15,23,42,0.15)); background: var(--surface, #FFFFFF); color: var(--text-primary, #0F172A); font-size: 0.88rem; outline: none; font-family: inherit; width: 100%;">
                                                    <option value="none">None</option>
                                                    <option value="low">1-2 cups</option>
                                                    <option value="high">3+ cups</option>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label>Wearable Tracker</label>
                                                <select name="wearable" style="padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color, rgba(15,23,42,0.15)); background: var(--surface, #FFFFFF); color: var(--text-primary, #0F172A); font-size: 0.88rem; outline: none; font-family: inherit; width: 100%;">
                                                    <option value="none">None</option>
                                                    <option value="smartwatch">Smartwatch (Apple/Garmin)</option>
                                                    <option value="ring">Smart Ring (Oura)</option>
                                                </select>
                                            </div>
                                        </div>
                                    </fieldset>
                                    <div class="step-navigation">
                                        <button type="button" class="btn-secondary" onclick="prevStep(0)">← Back</button>
                                        <button type="button" class="btn btn-primary" onclick="nextStep(2)">Next →</button>
                                    </div>
                                </div>

                                <!-- STEP 3: Cognitive & System -->
                                <div class="form-step" id="step3">
                                    <fieldset class="baseline-section">
                                        <legend>Step 3: Environment & Security</legend>
                                        <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                                            <div class="form-group">
                                                <label>Focus Audio</label>
                                                <select name="focusAudio" style="padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color, rgba(15,23,42,0.15)); background: var(--surface, #FFFFFF); color: var(--text-primary, #0F172A); font-size: 0.88rem; outline: none; font-family: inherit; width: 100%;">
                                                    <option value="silence">Absolute Silence</option>
                                                    <option value="ambient">Ambient / Lo-Fi</option>
                                                    <option value="complex" selected>Complex / Progressive</option>
                                                    <option value="noise">White / Brown Noise</option>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label>Timezone</label>
                                                <select name="timezone" style="padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color, rgba(15,23,42,0.15)); background: var(--surface, #FFFFFF); color: var(--text-primary, #0F172A); font-size: 0.88rem; outline: none; font-family: inherit; width: 100%;">
                                                    <option value="UTC">UTC / GMT</option>
                                                    <option value="EST">Eastern Time</option>
                                                    <option value="PST">Pacific Time</option>
                                                    <option value="ASIA" selected>Asia / Dhaka (+6)</option>
                                                </select>
                                            </div>
                                            <div class="form-group span-full" style="grid-column: 1 / -1;">
                                                <label>Create Password</label>
                                                <input type="password" name="password" id="regPassword" placeholder="••••••••" required>
                                            </div>
                                        </div>
                                    </fieldset>
                                    <div class="step-navigation">
                                        <button type="button" class="btn-secondary" onclick="prevStep(1)">← Back</button>
                                        <button type="submit" class="btn btn-primary">Create Account</button>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </form>

    <script src="js/app.js"></script>
    <script>
        function nextStep(stepIndex) {
            const track = document.getElementById('formTrack');
            if (track) {
                track.style.transform = `translateX(-${stepIndex * 100}%)`;
            }
        }

        function prevStep(stepIndex) {
            const track = document.getElementById('formTrack');
            if (track) {
                track.style.transform = `translateX(-${stepIndex * 100}%)`;
            }
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
                title.textContent = 'Welcome back';
                subtitle.textContent = 'Enter your credentials to access your telemetry dashboard.';
            } else {
                loginForm.style.display = 'block'; // Make sure container flex is layout ready
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
                title.textContent = 'Begin tracking';
                subtitle.textContent = 'Configure your physiological and environmental baseline.';
                nextStep(0); // Reset slider to step 1
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const carouselContainer = document.getElementById('dynamic-carousel');
            const overlay = document.querySelector('.auth-quote-overlay');
            const quoteEl = document.getElementById('dynamic-quote');
            const authorEl = document.getElementById('dynamic-author');
            
            const photoIDs = [
                "1518147895015-4dcfa84be013",
                "1528319725582-ddc096101511",
                "1499209974431-9cbcece7f88d",
                "1506126613408-eca07ce68773",
                "1475924156734-496f6cac6ec1",
                "1447452001602-7090c7ab2db3",
                "1508672019048-805c876b67e2",
                "1469474968028-56623f02e42e",
                "1434030216411-0b793f4b4273",
                "1515023115689-589c33041d3c",
                "1515377905703-c4788e51af15",
                "1529333166437-7750a6dd5a70",
                "1493721515592-225381cd09fa",
                "1446071103084-c257b5f70672",
                "1505684617551-92be098e9a65",
                "1536622204-7407a9e3fc15",
                "1464822759023-fed622ff2c3b",
                "1445462529983-5596cb10eecc",
                "1512411993460-e883e05a8f9c",
                "1470724610486-1d37b7ce7009",
                "1498661726053-eb3e9db29986",
                "1519681393608-41078f40c115",
                "1495954484750-af469f2f9be5",
                "1494587351196-bbf5f29cff42",
                "1507281736553-f4226b9fbb66",
                "1499209974431-9cbcece7f88d",
                "1522204523171-d6152a5dc837",
                "1511216113886-f3089d1b6a37",
                "1472214103451-9374bd1c798e",
                "1532453288672-3a27e9be9efd"
            ];

            const texts = [
                "Context switching isn't free—it charges a heavy tax on working memory.",
                "Protect your cognitive bandwidth like your most precious metabolic asset.",
                "Flow state is fragile. Defend it with ruthless telemetry.",
                "Burnout is the accumulation of invisible micro-stressors.",
                "Your attention is the only currency that truly matters today.",
                "Ambient noise spikes cortisol. Measure your environment.",
                "Multitasking is a myth; you are just rapidly degrading your focus.",
                "Mental energy is finite. Allocate it mathematically.",
                "Identify your peak focus windows and ruthlessly guard them.",
                "Continuous partial attention is the silent killer of deep work.",
                "Fatigue begins long before you consciously feel it.",
                "Quantify your environment to optimize your physiological output.",
                "Every notification is a micro-fracture in your concentration.",
                "Cognitive load management is the ultimate competitive advantage.",
                "Stop guessing about your stress levels. Start measuring them.",
                "Data-driven focus leads to sustainable high performance.",
                "Your brain is a biological engine; track its RPMs.",
                "Design your workspace to minimize environmental friction.",
                "Deep work requires deep recovery. Track both.",
                "Attention residue from your last task poisons your current one.",
                "Treat your focus blocks like non-negotiable metabolic cycles.",
                "High-performance engineering requires high-performance rest.",
                "The quantified self is the optimized self.",
                "Don't manage your time; manage your cognitive energy.",
                "A cluttered environment creates a cluttered working memory.",
                "Visual noise consumes processing power. Streamline your field of view.",
                "Measure the cost of a distraction in metabolic terms.",
                "Willpower is a depleting resource. Rely on environmental design instead.",
                "Stress is data. Analyze it, don't just endure it.",
                "Optimal bandwidth requires optimal acoustic environments.",
                "Track your tab density; it directly correlates to anxiety.",
                "Every unread message is a cognitive open loop.",
                "Protect your morning bandwidth from low-value inputs.",
                "Frictionless context switching is an illusion.",
                "Your baseline stress dictates your maximum output.",
                "Observe your cognitive degradation over the workday.",
                "Screen time isn't equal; measure the intensity of the engagement.",
                "Optimize for flow, not just for time spent at the desk.",
                "Physiological metrics don't lie about your cognitive state.",
                "The architecture of your day dictates the architecture of your mind.",
                "Prevent burnout by catching the telemetry spikes early.",
                "Mental clarity is engineered, not accidental.",
                "Track the delta between your perceived effort and actual strain.",
                "Your nervous system is the ultimate hardware. Monitor its temperature.",
                "Acoustic telemetry reveals hidden drains on your focus.",
                "Unstructured workloads create sustained low-grade panic.",
                "Harness your data to build a personalized cognitive firewall.",
                "Focus is a measurable, trainable metabolic process.",
                "Treat cognitive debt as seriously as financial debt.",
                "Your environment is either taxing your focus or subsidizing it."
            ];

            let currentIndex = 0;
            let textIndex = 0;
            let currentSlideEl = null;

            function loadInitialImage(index) {
                const initImg = new Image();
                
                initImg.onload = () => {
                    initImg.className = 'auth-slide';
                    carouselContainer.insertBefore(initImg, overlay);
                    void initImg.offsetWidth;
                    initImg.classList.add('active');
                    currentSlideEl = initImg;
                    
                    startCarousel();
                };
                
                initImg.onerror = () => {
                    currentIndex = (index + 1) % photoIDs.length;
                    loadInitialImage(currentIndex); 
                };
                
                initImg.src = `https://images.unsplash.com/photo-${photoIDs[index]}?auto=format&fit=crop&w=1200&q=80`;
            }

            function startCarousel() {
                setInterval(() => {
                    const nextIndex = (currentIndex + 1) % photoIDs.length;
                    const nextImg = new Image();
                    
                    nextImg.onload = () => {
                        nextImg.className = 'auth-slide';
                        carouselContainer.insertBefore(nextImg, overlay);
                        void nextImg.offsetWidth; 
                        nextImg.classList.add('active');
                        
                        if (currentSlideEl) {
                            currentSlideEl.classList.remove('active');
                            const staleEl = currentSlideEl;
                            setTimeout(() => {
                                if (staleEl.parentNode) staleEl.parentNode.removeChild(staleEl);
                            }, 1500);
                        }
                        
                        quoteEl.style.opacity = 0;
                        authorEl.style.opacity = 0;
                        
                        setTimeout(() => {
                            textIndex = (textIndex + 1) % texts.length;
                            quoteEl.textContent = `"${texts[textIndex]}"`;
                            quoteEl.style.opacity = 1;
                            authorEl.style.opacity = 1;
                        }, 500);
                        
                        currentSlideEl = nextImg;
                        currentIndex = nextIndex;
                    };

                    nextImg.onerror = () => {
                        currentIndex = nextIndex;
                    };

                    nextImg.src = `https://images.unsplash.com/photo-${photoIDs[nextIndex]}?auto=format&fit=crop&w=1200&q=80`;
                }, 5000);
            }

            loadInitialImage(currentIndex);
        });
    </script>
</body>
</html>
